# Jekyll configuration. GitHub Pages builds the site with these settings.
# All site content lives in _data/; the HTML in _layouts/, _includes/ and the pages only handles presentation.

title: Kiran Bhat
# Used for the "last updated" date, which is the build time.
timezone: America/Los_Angeles

# The guestbook's server (guestbook-worker/, on Cloudflare), e.g. https://kiranvbhat-guestbook.NAME.workers.dev.
# Leave it empty until the server is set up; the guestbook page shows "coming soon" until then.
guestbook_api: https://kiranvbhat-guestbook.kiranvbhat.workers.dev

exclude:
  # The guestbook's server code; it runs on Cloudflare, not as part of the site (see guestbook-worker/README.md).
  - guestbook-worker
  - README.md
  - LICENSE
  - Gemfile
  - Gemfile.lock
  - vendor
  # Original cursor files; the site uses the converted PNGs in assets/cursors/web/ (see _scripts/convert_cursors.py).
  - assets/cursors/originals
  # The original font file; the site uses the smaller .woff2 copy.
  - assets/fonts/*.otf

kramdown:
  # Keep quotes and dashes in _data/ text exactly as typed instead of converting them to curly quotes / en dashes.
  smart_quotes: ["apos", "apos", "quot", "quot"]
  typographic_symbols: { hellip: "...", mdash: "---", ndash: "--", laquo: "<<", raquo: ">>", laquo_space: "<< ", raquo_space: " >>" }
