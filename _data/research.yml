# Research. Shown newest first, sorted by `end` then `start`.
# Dates are YYYY-MM (e.g. 2025-08); use `end: present` for ongoing work. Both are optional.
#
# conference (optional): where the paper was accepted, shown before the dates
# paper (optional): link to the paper
# media (optional): exactly one of
#   image: path to an image/gif (add `background: white` for see-through logos with dark artwork; the Minimal
#          version can instead adapt them to dark/light mode with `recolor` or `dark_invert`, see
#          _includes/minimal/entries.html)
#   youtube: YouTube video id
# Descriptions support Markdown (e.g. **bold**).

- title: Robust Neural Audio Fingerprinting using Music Foundation Models
  conference: NeurIPS 2025 AI for Music Workshop
  paper: https://openreview.net/forum?id=oaeP03QCjE
  media:
    image: assets/portfolio/research/neurips logo.png
    background: white
    dark_invert: true  # Minimal: its dark text turns white in dark mode (instead of the white background)
    height: 110
  start: 2025-08
  end: 2025-10
  description: >-
    Fine-tuned music foundation models (MuQ, MERT) with a nonlinear projection head using contrastive learning.
    Achieved an **88.2% track-level hit rate** and **95.5% segment-level F1**, vs. 70.3% and 80.8% for the prior
    state of the art (BEATs), and beat the Shazam-like Dejavu by 39 points (49.2% hit rate). Co-first author.

