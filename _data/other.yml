# Content for the Other page.
#
# media: exactly one of
#   youtube: YouTube video id
#   embed: URL of an embeddable page (e.g. Panoraven, Albumizr)
#   image: path to an image/gif
# `start` and `end` (YYYY-MM) are optional. Entries show in the order written here, except volunteering, which is
# shown newest first by date (entries without dates go last).
# Descriptions support Markdown (e.g. **bold**).

intro: A collection of random things I have worked on or found interesting.

photography:
