# Cursors offered in the cursor menu (settings box), in this order. See _scripts/convert_cursors.py.
# To add one, add an entry with `id`, `name` (the title in the menu), and `file:` under `cursor:` (normal) and
# `pointer:` (hovering a link; optional), then run the script. It fills in the rest:
#   hotspot  the pixel (x, y) that does the clicking
#   frames   number of animation frames, shown `delay` milliseconds apart (animated cursors only)

- id: attack-on-titan
  name: Attack on Titan
  cursor:
    file: assets/cursors/sweezy cursors/Attack on Titan Gear Sword & Scout Logo Cursor--cursor--SweezyCursors.cur
    hotspot: [0, 1]
  pointer:
    file: assets/cursors/sweezy cursors/Attack on Titan Gear Sword & Scout Logo Cursor--pointer--SweezyCursors.cur
    hotspot: [4, 3]
