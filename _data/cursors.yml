# Cursors offered in the cursor menu (settings box), in this order. See _scripts/convert_cursors.py.
# Each one's original files are in assets/cursors/originals/<id>/ (cursor, plus optional link and text).
# You can edit:
#   name     the title in the menu
#   source   where the cursor came from (just for reference; not shown on the site)
#   size     the cursor's size in pixels (default 32; cursors over 32 can switch to the normal arrow near
#            the edge of the browser window)
#   effect   a special effect, named after the cursor it was made for (see assets/js/cursor-effects/):
#            `paintbrush` (drag to draw), `darth-vader` (a short red trail) or `megumin` (click to explode)
#   static   put `static: true` under a state to use just the first frame of an animated cursor (animation
#            can flicker)
# and reorder entries. The script fills in the rest:
#   hotspot  the pixel (x, y) that does the clicking
#   frames   number of animation frames, shown `delay` milliseconds apart (animated cursors only)

