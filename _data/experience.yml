- role: Audio ML Engineer (Part-time)
  organization: SoundPatrol
  start: 2024-12
  end: 2026-10
  link: https://www.soundpatrol.com/press-release
  media:
    image: assets/portfolio/experience/soundpatrol logo black.png  # the original is see-through, and vanished in light mode
    still: assets/portfolio/experience/soundpatrol logo.png  # Minimal shows the see-through original instead
    recolor: true  # drawn in the text color, for dark/light mode
    height: 72
  description: >-
    I prototyped a novel **distortion-free watermarking** method for generative AI music, with **100% detection** in
    high-entropy generations. I aligned **1700+ hours of MIDI-audio data** for fine-tuning a transcription model,
    filtering out 95% of mismatched pairs. I also created new scanners for YouTube, TikTok, and SoundCloud, increasing
    relevant dashboard results by **over 10x**, and deployed a scalable audio tagging model for music/non-music
    separation with **over 99% accuracy**.

- role: Researcher
  organization: ChucK Development Team
  start: 2024-03
  end: 2026-06
  link: https://chuck.stanford.edu/
  media:
    image: assets/portfolio/experience/chuck_logo_big small.png
    still: assets/portfolio/experience/chuck_logo.png  # Minimal shows the see-through logo instead
    height: 140
  description: >-
    I'm developing new features for the **music programming language ChucK**, in collaboration with several PhD
    students at CCRMA and the creator of ChucK, Professor Ge Wang. I helped design SMucK, a system for **simplified
    musical input** and **dynamic playback** in ChucK. SMucK enables users to import MIDI/MusicXML files into ChucK,
    and manipulate their playback in real-time.

