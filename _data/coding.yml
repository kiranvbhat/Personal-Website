# Coding projects. Shown newest first, sorted by `end` then `start`; entries without dates go last, in file order.
# Dates are YYYY-MM (e.g. 2023-09); use `end: present` for ongoing work. Both are optional.
#
# media: exactly one of
#   image: path to an image/gif
#   youtube: YouTube video id
# paper, demo, poster, github (optional): links shown as buttons under the description (web addresses, or files in the site
#   like assets/portfolio/coding/ghostwriter_paper.pdf)
# hidden: true keeps an entry here without showing it on the site.
# Descriptions support Markdown (e.g. *italics*, **bold**).

- title: Symbolic and Audio-based Music Identification
  start: 2025-03
  end: 2025-06
  media:
    image: assets/portfolio/coding/symbolic_and_audio_mi small.jpg
  description: >-
    Identifies songs from symbolic queries using a DNA strand matching technique, matching 20/20 in a small test.
    Also searches 2,000 noisy phone recordings with MuQ embeddings, matching all 13 queries that had a true match.

