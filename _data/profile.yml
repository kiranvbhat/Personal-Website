# Visits are counted with GoatCounter (see _includes/goatcounter.html). goatcounter is your site code, the CODE in
# CODE.goatcounter.com; blank turns it off. The homepage counter (padded to 6 digits) shows hit_count plus the site's
# total visitors from GoatCounter (this needs "Allow adding visitor counts on your website" on in GoatCounter's
# settings; it can lag up to 4 hours), or just hit_count while loading, if GoatCounter can't be
# reached, or if goatcounter is blank.
goatcounter: kiranvbhat
hit_count: 23670

# Each entry is a paragraph. Markdown is allowed (e.g. [text](link), **bold**). A link to #cursor-menu opens the cursor menu.
# Smileys from assets/graphics/emojis/: ![:)](/assets/graphics/emojis/smile.gif){:.smiley} (the {:.smiley} lines it up with the text).
bio:
  - Hey ![:)](/assets/graphics/emojis/smile.gif){:.smiley} I just graduated from Stanford, where I studied computer science (AI) and its intersection with music.
  - In my spare time, I enjoy writing [music](music), watching/[making films](performances), and playing basketball.
  - While you're here, please [sign my guestbook](/guestbook-sign) and check out all the [awesome cursor options](#cursor-menu) ![:cool:](/assets/graphics/emojis/cool.gif){:.smiley}
  - Thanks for stopping by! -Kiran

