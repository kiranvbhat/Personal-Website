{%- comment -%}
  Color button for the settings box: switches between dark and light. The choice is saved in the browser;
  color-init.html applies it on each page load.
{%- endcomment -%}
<div class="appearance">
  color:
  <button type="button" class="color-toggle" id="color-toggle"></button>
</div>
<script>
  (function () {
    var button = document.getElementById("color-toggle"), root = document.documentElement;
    function show() {
      var light = root.dataset.color === "light";
      button.textContent = light ? "Light" : "Dark";
      button.title = light ? "Switch to dark" : "Switch to light";
    }
    button.addEventListener("click", function () {
      var color = root.dataset.color === "light" ? "dark" : "light";
      if (color === "light") root.dataset.color = "light";
      else delete root.dataset.color;
      try { localStorage.setItem("color", color); } catch (e) {}
      show();
    });
    show();
  })();
</script>
