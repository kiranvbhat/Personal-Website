{%- comment -%}
  Renders a card's media. Params: media (a `media:` entry from _data/), title (used for alt text / iframe title).
{%- endcomment -%}
{%- assign m = include.media -%}
{%- if m.image -%}
<img src="{{ m.image | relative_url }}" class="img-fluid" alt="{{ include.title | escape }}">
{%- elsif m.youtube -%}
<div class="ratio ratio-16x9">
  <iframe class="img-fluid" src="https://www.youtube.com/embed/{{ m.youtube }}" title="{{ include.title | escape }}" frameborder="0" allow="accelerometer; gyroscope" allowfullscreen></iframe>
</div>
{%- elsif m.bandcamp -%}
<div class="ratio ratio-1x1" style="--bs-aspect-ratio: 150%;">
  <iframe class="bandcamp" src="https://bandcamp.com/EmbeddedPlayer/album={{ m.bandcamp }}/size=large/bgcol=ffffff/linkcol=333333/transparent=true/" title="{{ include.title | escape }}" seamless></iframe>
</div>
{%- elsif m.embed -%}
<div class="ratio ratio-16x9">
  <iframe class="embed" src="{{ m.embed }}" title="{{ include.title | escape }}" scrolling="no" allow="accelerometer; magnetometer; gyroscope" allowfullscreen></iframe>
</div>
{%- endif -%}
